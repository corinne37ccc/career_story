<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>林宛萱 Corinne Lin</title>
<meta name="description" content="林宛萱（Corinne Lin）：9 年以上策略顧問經驗，以及與 AI 協作開發航空數據產品的能力地圖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout：單欄敘事。首屏 → 能力地圖（組織圖＋代表專案按鈕）→ 職涯歷程（階段按鈕＋倒序時間軸）→ AI 協作成果。固定淺色，不跟隨瀏覽器深色設定。 */
:root{
  --bg:#f3f5f8;
  --surface:#ffffff;
  --surface-2:#edf0f5;
  --ink:#121a28;
  --ink-2:#435066;
  --muted:#667185;
  --line:#dbe0e8;
  --line-2:#c2c9d5;
  --accent:#1c3f78;
  --focus:#2a6fd6;
  --shade:rgba(18,26,40,.08);
  /* 五個能力類別：統一藍綠色系（白字對比皆 ≥ 4.7） */
  --t-c:#1b365f;
  --t-d:#225a96;
  --t-s:#1a7899;
  --t-k:#0d6b63;
  --t-a:#3d8152;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light only;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
@media (min-width:760px){.wrap{padding-inline:32px}}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(243,245,248,.9);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.nav a.lnk{position:relative;display:block;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px;white-space:nowrap;transition:color .2s}
.nav a.lnk.active{color:var(--accent);font-weight:700}
.nav a.lnk.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-9px;height:2px;background:var(--accent)}
.nav a.lnk:hover{background:var(--surface-2);color:var(--ink)}
.nav .s{display:none}
@media (max-width:560px){.brand span{display:none}.nav .l{display:none}.nav .s{display:inline}.nav a.lnk{padding:6px 8px}}

/* ---------- hero ---------- */
.hero{padding-block:64px 52px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .kicker{font-weight:500;font-size:15px;letter-spacing:.08em;color:var(--ink-2)}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5.3vw,50px);line-height:1.1;letter-spacing:.02em;margin-top:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px}
.hero h1 .en{font-family:var(--font-body);font-weight:400;font-size:clamp(15px,2vw,19px);letter-spacing:.03em;color:var(--ink-2)}
.thesis{font-family:var(--font-display);font-weight:600;font-size:clamp(21px,3.2vw,30px);line-height:1.45;margin-top:18px;max-width:22em;color:var(--ink-2)}
/* 重點數據：以線條分隔，不做成圖卡 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:36px 0 0;border-top:1px solid var(--line-2)}
.stat{padding:18px 18px 4px 0;min-width:0}
.stat + .stat{padding-left:20px;border-left:1px solid var(--line)}
.stat dt{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.2;white-space:nowrap;color:var(--ink)}
.stat dd{margin:6px 0 0;color:var(--ink-2);font-size:15px;font-weight:500;line-height:1.5}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#163463}

/* ---------- sections ---------- */
section{padding-block:72px;scroll-margin-top:56px}
/* 每個主題一種底色：能力地圖白底、職涯歷程淺灰藍、AI 協作成果深藍 */
#capability{background:#ffffff}
#career{background:#e9eef5}
#ai{background:#13284a}
@media (max-width:760px){section{padding-block:52px}}
.sec-head{display:grid;gap:12px;margin-bottom:30px}
.chap{display:flex;align-items:center;gap:14px}
.chap .no{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,4.6vw,46px);line-height:1;color:var(--accent);font-variant-numeric:lining-nums}
.chap .en{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chap::after{content:"";flex:1;height:1px;background:var(--line-2)}
#ai .chap .no{color:#8fb4ea}
#ai .chap .en{color:rgba(255,255,255,.7)}
#ai .chap::after{background:rgba(255,255,255,.28)}
#ai .sec-head h2,#ai .works-head h3{color:#fff}
.sec-head h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,38px);line-height:1.25}
.sec-head .big{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,2.4vw,24px);line-height:1.65;max-width:34em;color:var(--ink-2);margin-top:4px}
#ai .sec-head .big{color:rgba(255,255,255,.88)}

/* ---------- capability map：看板式，五個類別並排成直欄，色塊欄＋白色能力磚 ---------- */
.map{scroll-margin-top:64px}
@media (min-width:760px){.map{background:#fff;border:1px solid var(--line);padding:24px 24px 20px}}
.regions{position:relative;display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch}
.region{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--tc);padding:0 10px 12px;transition:opacity .3s,filter .3s}
.rh{display:block;width:100%;background:none;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.3);padding:14px 4px 10px;margin-bottom:10px;text-align:left;cursor:default}
.rn{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(15px,1.4vw,19px);line-height:1.3;letter-spacing:.03em;white-space:nowrap}
.rn .lat{font-family:var(--font-body);font-weight:700;letter-spacing:0}
.rsub{display:block;margin-top:4px}
.ren{display:block;font-family:var(--font-mono);font-size:10px;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.badge{position:absolute;top:-11px;right:8px;display:grid;place-items:center;min-width:42px;height:24px;padding:0 7px;background:#fff;color:var(--tc);border:2px solid var(--tc);font-family:var(--font-body);font-weight:700;font-size:12.5px;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.region.on .badge{transform:scale(1)}
.regions.capmode .badge{display:none}
.ritems{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start}
.node{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;background:rgba(255,255,255,.93);border:0;border-radius:2px;padding:8px 20px;text-align:center;text-wrap:balance;font-size:14.5px;line-height:1.4;font-weight:500;color:var(--ink);cursor:pointer;transition:background .3s var(--d,0s),box-shadow .3s var(--d,0s),opacity .3s}
.node:hover{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.node .mk{display:none;position:absolute;left:9px;top:50%;width:6px;height:11px;margin-top:-7px;border:solid var(--tc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.node.on{background:#fff;font-weight:700;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.node.on .mk{display:block}
.regions.sel .region:not(.on){opacity:.4;filter:saturate(.5)}
.regions.sel .node.off{opacity:.32}
@media (max-width:1039px){
  .regions{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"c d" "s s" "k a"}
  .region[data-theme="C"]{grid-area:c}
  .region[data-theme="D"]{grid-area:d}
  .region[data-theme="S"]{grid-area:s}
  .region[data-theme="K"]{grid-area:k}
  .region[data-theme="A"]{grid-area:a}
  .ritems.c2-sm{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rn{font-size:18px}
}
@media (max-width:759px){
  .regions{gap:8px}
  .region{padding:0 7px 8px}
  .rh{padding:9px 2px 7px;margin-bottom:7px}
  .rn{font-size:15px;letter-spacing:.02em}
  .ren{display:none}
  .badge{top:-9px;right:5px;min-width:22px;height:20px;font-size:11.5px;padding:0 4px}
  .badge .u{display:none}
  .ritems{gap:5px}
  .node{min-height:32px;font-size:12.5px;padding:5px 13px}
  .node .mk{left:5px;width:5px;height:9px;margin-top:-6px;border-width:0 2px 2px 0}
}
.tip{position:absolute;z-index:6;width:270px;max-width:calc(100% - 12px);background:#fff;border:1px solid var(--line-2);border-radius:4px;padding:10px 13px;box-shadow:0 10px 28px rgba(18,26,40,.14);pointer-events:none;font-size:13.5px;line-height:1.6}
.tip .th{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.tip b{display:block;font-size:15px;margin-top:1px}
.tip p{color:var(--ink-2);margin-top:4px}
.tip .act{color:var(--muted);font-size:12.5px;margin-top:6px}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}

/* picker */
.pick{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.pick-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:32px;margin-bottom:12px}
.pick-t{font-weight:700;font-size:15px}
.pick-sum{color:var(--ink-2);font-size:14.5px;flex:1 1 240px;min-width:0}
.pick-sum b{color:var(--ink)}
.clear{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.clear:hover{color:var(--ink);border-color:var(--ink-2)}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.pg{display:flex;flex-direction:column;gap:6px;min-width:0}
.pg-l{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line-2);padding:0 2px 6px}
.pg-l .t{font-weight:700;font-size:14.5px}
.pg-l .p{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.pg-items{display:flex;flex-direction:column;gap:6px}
.pi{display:flex;align-items:center;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;line-height:1.45;cursor:pointer;color:var(--ink);transition:background .2s,border-color .2s}
.pi:hover{border-color:var(--ink-2)}
.pi .tg{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:1.6;margin-left:auto}
.pi[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pi[aria-pressed="true"] .tg{color:#fff;border-color:rgba(255,255,255,.5)}
.pi.rel{border-color:var(--tc);box-shadow:inset 3px 0 0 var(--tc);font-weight:700}
.pi.dim{opacity:.3}
@media (max-width:759px){
  .pick{position:sticky;bottom:0;z-index:5;background:#ffffff;margin:20px -16px 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2)}
  .pick-head{padding-inline:16px;margin-bottom:6px;min-height:28px;flex-wrap:nowrap}
  .pick-t{font-size:13.5px;flex:none}
  .pick-sum{font-size:13px;line-height:1.45}
  .clear{flex:none;font-size:12.5px;padding:2px 10px}
  .picker{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 4px;scroll-padding-inline:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 24px),transparent)}
  .picker::-webkit-scrollbar{display:none}
  .pg{flex-direction:row;align-items:center;flex:none;gap:6px}
  .pg-l{flex-direction:column;align-items:flex-start;gap:0;border:0;padding:0 2px 0 0}
  .pg-l .t{font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
  .pg-l .p{font-size:10.5px}
  .pg-items{flex-direction:row}
  .pi{width:auto;white-space:nowrap;padding:7px 11px;font-size:13.5px}
  .pi .tg{margin-left:0}
  .pi.dim,.pg.none{display:none}
}

/* ---------- career ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:14.5px;cursor:pointer;color:var(--ink-2)}
.filters button:hover{border-color:var(--ink-2);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{list-style:none;margin:0;padding:0}
/* 職涯：單欄，時間寫在階段名稱上方 */
.tl > li{padding-block:32px;border-top:1px solid var(--line)}
.tl > li.first{border-top:0}
.when{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-bottom:4px}
.when .mono{font-size:13.5px;color:var(--ink-2);font-weight:500}
.when .org{font-size:13px;color:var(--muted)}
.stage-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.stage-h h3{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.3}
.stage-h .en{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.role{margin-top:6px;color:var(--ink-2)}
.metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent)}
.metric .k{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.metric .v{font-weight:700}
.sub{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-top:24px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
@media (max-width:700px){.cases{grid-template-columns:minmax(0,1fr)}}
.case{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);padding:16px 18px 14px}
.case.role{background:#dce4ee;border-color:#a9b5c7}
.case header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.case h5{font-size:16.5px;font-weight:700;line-height:1.45}
.case > p{color:var(--ink-2);font-size:15px;line-height:1.7}
.case footer{margin-top:auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:6px}
.scale{display:inline-block;font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:1px 8px;line-height:1.7;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:2px 10px;margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);line-height:1.6;min-width:0;flex:1 1 200px}
.dots li{display:inline-flex;align-items:center;gap:5px}
.see{flex:none;background:none;border:1px solid var(--line-2);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.see:hover{border-color:var(--accent);color:var(--accent)}
.edu h3{font-family:var(--font-display);font-weight:600;font-size:22px}
.edu .note{color:var(--ink-2);margin-top:6px;font-size:15px}
.tonext{margin-top:14px;font-size:15px}

/* ---------- AI ---------- */
.flow-wrap{background:var(--surface);border:1px solid var(--line);padding:22px 24px 20px;margin:0}
.flow-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;margin-bottom:16px}
.flow-head h3{font-size:17px;font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.who{display:inline-block;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:0 6px;line-height:1.7}
.who.me{border:1px solid var(--ink-2);color:var(--ink)}
.who.ai{background:var(--t-a);color:#fff;border:1px solid var(--t-a)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.flow li{position:relative;min-width:0;border-top:2px solid var(--ink);padding-top:12px}
.flow li.ai{border-top-color:var(--t-a)}
.flow li:not(:last-child)::after{content:"";position:absolute;top:-6px;right:-17px;width:10px;height:10px;border-top:2px solid var(--line-2);border-right:2px solid var(--line-2);transform:rotate(45deg)}
.flow .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.flow h4{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:16.5px;font-weight:700;margin-top:2px}
.flow p{font-size:14px;color:var(--ink-2);margin-top:6px;line-height:1.65}
.uses{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.ctag{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--tc) 40%,#fff);background:color-mix(in srgb,var(--tc) 7%,#fff);border-radius:999px;padding:0 8px;font-size:12px;line-height:1.75;color:var(--ink)}
.loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;margin-top:14px}
.loop div{grid-column:3 / 6;position:relative;border:1.5px dashed var(--line-2);border-top:0;border-radius:0 0 12px 12px;height:22px}
.loop div::before{content:"";position:absolute;left:-6px;top:-6px;border:5px solid transparent;border-bottom:7px solid var(--line-2);border-top:0}
.loop span{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:var(--surface);padding:0 10px;font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:860px){
  .flow{grid-template-columns:minmax(0,1fr);gap:0}
  .flow li{border-top:0;border-left:2px solid var(--ink);padding:0 0 18px 16px}
  .flow li.ai{border-left-color:var(--t-a)}
  .flow li:not(:last-child)::after{display:none}
  .loop{display:block;margin-top:2px}

    sel = type && (opts.force || !same(type, id)) ? { type, id } : null;
    apply();
    if (opts.scroll) $('#map').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  function apply() {
    const isItem = !!sel && sel.type === 'item', isCap = !!sel && sel.type === 'cap';
    const on = isItem ? new Set(items[sel.id].caps) : isCap ? new Set([sel.id]) : null;
    tree.classList.toggle('sel', !!on);
    tree.classList.toggle('capmode', isCap);
    let k = 0;
    cols.forEach((col) => {
      const nodes = [...col.querySelectorAll('.node')];
      const hit = nodes.map((n, i) => (on && on.has(n.dataset.tipCap) ? i : -1)).filter((i) => i >= 0);
      col.classList.toggle('on', hit.length > 0);
      col.querySelector('.badge').innerHTML = isItem && hit.length ? `${hit.length}<span class="u">&nbsp;項</span>` : '';
      nodes.forEach((n, i) => {
        const isOn = hit.includes(i);
        n.classList.toggle('on', isOn);
        n.classList.toggle('off', !!on && !isOn);
        n.setAttribute('aria-pressed', isCap && isOn ? 'true' : 'false');
        n.style.setProperty('--d', isOn ? `${(k++) * 45}ms` : '0ms');
      });
    });
    const rel = isCap ? new Set(capItems[sel.id]) : null;
    document.querySelectorAll('.pi').forEach((b) => {
      const id = b.dataset.item, r = !!rel && rel.has(id);
      b.setAttribute('aria-pressed', isItem && sel.id === id ? 'true' : 'false');
      b.classList.toggle('rel', r);
      b.classList.toggle('dim', !!rel && !r);
      b.style.cssText = r ? tc(themeOf[sel.id].id) : '';
    });
    document.querySelectorAll('.pg').forEach((g) => g.classList.toggle('none', !!rel && !g.querySelector('.pi.rel')));
    const sum = $('#sum'), clr = document.querySelector('[data-clear]'), pk = $('#picker');
    if (isItem) {
      const it = items[sel.id];
      sum.innerHTML = `<b>${esc(it.title)}</b>｜運用 ${it.caps.length} 項能力，橫跨 ${themeCount(it.caps)} 類`;
      clr.hidden = false;
      const cur = pk.querySelector(`[data-item="${sel.id}"]`);
      if (cur && pk.scrollWidth > pk.clientWidth + 4) {
        const l = cur.getBoundingClientRect().left - pk.getBoundingClientRect().left + pk.scrollLeft;
        const vis = l >= pk.scrollLeft + 12 && l + cur.offsetWidth <= pk.scrollLeft + pk.clientWidth - 24;
        if (!vis) pk.scrollTo({ left: Math.max(0, l - 24), behavior: 'smooth' });
      }
    } else if (isCap) {
      sum.innerHTML = `<b>${esc(caps[sel.id].name)}</b>｜${capItems[sel.id].length} 個代表專案用到這項能力，點選專案可看完整能力組合`;
      clr.hidden = false;
      pk.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      sum.textContent = '';
      clr.hidden = true;
    }
  }

  // ---------- tooltip（滑鼠移過去顯示說明；觸控點一下顯示） ----------
  let tipFor = null;
  function showTip(el) {
    let head, name, desc, t;
    if (el.dataset.tipCap) { const c = caps[el.dataset.tipCap]; t = themeOf[c.id]; head = t.name; name = c.name; desc = c.desc; }
    else { t = themeById[el.dataset.tipTheme]; head = t.en; name = t.name; desc = t.desc; }
    const act = el.dataset.tipCap ? `<div class="act">點一下：查看用到這項能力的專案（${capItems[el.dataset.tipCap].length} 個）</div>` : '';
    tip.innerHTML = `<div class="th" style="${tc(t.id)}"><i class="sw"></i>${esc(head)}</div><b>${esc(name)}</b><p>${esc(desc)}</p>${act}`;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), tr = tree.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight, W = tree.clientWidth;
    const left = Math.max(6, Math.min(W - tw - 6, r.left - tr.left + r.width / 2 - tw / 2));
    let top = r.top - tr.top - th - 8;
    if (top < 0) top = r.bottom - tr.top + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tipFor = el;
  }
  const hideTip = () => { tip.hidden = true; tipFor = null; };
  let lastPointer = 'mouse';
  tree.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; });
  tree.querySelectorAll('.node, .rh').forEach((el) => {
    el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') showTip(el); });
    el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hideTip(); });
    el.addEventListener('focus', () => { if (matchMedia('(hover: hover)').matches) showTip(el); });
    el.addEventListener('blur', hideTip);
    el.addEventListener('click', () => {
      if (el.dataset.tipCap) {
        select('cap', el.dataset.tipCap);
        if (lastPointer !== 'mouse') (same('cap', el.dataset.tipCap) ? showTip(el) : hideTip());
      } else if (lastPointer !== 'mouse') (tipFor === el ? hideTip() : showTip(el));
    });
  });

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.node, .rh')) hideTip();
    const t = e.target.closest('[data-item],[data-see],[data-clear],[data-filter]');
    if (!t) return;
    if (t.hasAttribute('data-clear')) return select(null, null);
    if (t.dataset.filter) return setFilter(t.dataset.filter);
    if (t.dataset.see) return select('item', t.dataset.see, { force: true, scroll: true });
    if (t.dataset.item) return select('item', t.dataset.item);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideTip(); if (sel) select(null, null); } });
  window.addEventListener('scroll', () => { if (!tip.hidden && lastPointer !== 'mouse') hideTip(); }, { passive: true });

  // ---------- 導覽列：亮起目前所在的章節 ----------
  const spySections = ['capability', 'career', 'ai'].map((id) => document.getElementById(id));
  const spyLinks = [...document.querySelectorAll('.nav a.lnk[href^="#"]')];
  let spyTick = false;
  function spy() {
    spyTick = false;
    const line = 120;
    let cur = null;
    spySections.forEach((s) => { if (s.getBoundingClientRect().top <= line) cur = s.id; });
    const last = spySections[spySections.length - 1];
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = last.id;
    spyLinks.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + cur));
  }
  window.addEventListener('scroll', () => { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });
  spy();
  apply();
})();
</script>
</body>
</html>
